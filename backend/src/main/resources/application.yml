server:
  # 端口支持环境变量覆盖（避免与本机安全工具如 Burp/Yakit 的 8080 冲突）
  port: ${SERVER_PORT:18080}

spring:
  application:
    name: limemall-backend
  task:
    scheduling:
      # 退款网关可能较慢，给超时关单留出独立调度线程。
      pool:
        size: 2
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 支持环境变量覆盖：MYSQL_HOST / MYSQL_PORT / MYSQL_DB / MYSQL_USER / MYSQL_PASSWORD
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:lime_mall}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 生产默认关闭 SQL 控制台打印（避免日志泄露参数/影响性能）；
    # 需要调试时临时将 logging.level.com.limemall.mapper 设为 debug
  global-config:
    banner: false

# 业务自定义配置（支持环境变量覆盖，便于服务器部署）
limemall:
  # 跨域额外白名单（本机与私有网段默认放行；公网前端独立域部署时在此追加完整 origin，逗号分隔）
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    # JWT 签名密钥（HS256，长度必须 >= 32 字节；生产环境请通过 JWT_SECRET 环境变量替换）
    secret: ${JWT_SECRET:LimeMall-Course-Design-2026-JWT-Secret-Key-LimeGreen}
    expire-hours: 24
  # 上传文件保存目录（生产环境通过 LIME_UPLOAD_DIR 指定，如 /opt/limemall/uploads）
  upload-dir: ${LIME_UPLOAD_DIR:uploads}
  order:
    # 未支付订单自动关闭时限（分钟）：定时任务每分钟扫描，超时自动关单并回补库存
    pay-timeout-minutes: ${ORDER_PAY_TIMEOUT_MINUTES:30}
  # 支付宝沙箱/生产配置（配置齐全即启用真实支付；未配置时前台支付返回明确错误）
  alipay:
    app-id: ${ALIPAY_APP_ID:}
    merchant-private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    gateway-url: ${ALIPAY_GATEWAY:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:}
    return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/shop/orders}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.limemall: info
