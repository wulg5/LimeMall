server:
  port: 8080

spring:
  application:
    name: limemall-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 支持环境变量覆盖：MYSQL_HOST / MYSQL_PORT / MYSQL_DB / MYSQL_USER / MYSQL_PASSWORD
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:lime_mall}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # 控制台打印 SQL，便于开发调试与课设演示
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false

# 业务自定义配置（支持环境变量覆盖，便于服务器部署）
limemall:
  jwt:
    # JWT 签名密钥（HS256，长度必须 >= 32 字节；生产环境请通过 JWT_SECRET 环境变量替换）
    secret: ${JWT_SECRET:LimeMall-Course-Design-2026-JWT-Secret-Key-LimeGreen}
    expire-hours: 24
  # 上传文件保存目录（生产环境通过 LIME_UPLOAD_DIR 指定，如 /opt/limemall/uploads）
  upload-dir: ${LIME_UPLOAD_DIR:D:/mall-course-design/uploads}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: info
    com.limemall: info
